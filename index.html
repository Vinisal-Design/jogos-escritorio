<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1030">
<title>Jogos do Escritório</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body {
    background: radial-gradient(ellipse at top, #3a2266 0%, #1a1030 60%, #0d0818 100%) fixed;
    color: #fff; font-family: "Lilita One", system-ui, sans-serif;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    -webkit-user-select: none; user-select: none;
  }
  h1 { text-align: center; font-size: clamp(34px, 10vw, 56px); line-height: 1; letter-spacing: .5px;
    color: #ffd83a; text-shadow: 0 4px 0 #6b3200; margin: 8px 0 6px; }
  .sub { text-align: center; font-family: system-ui, sans-serif; font-weight: 700; font-size: 15px; color: #c9b8ee; margin-bottom: 22px; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 18px; max-width: 760px; margin: 0 auto; }
  @media (min-width: 560px) { .grid { grid-template-columns: 1fr 1fr; } }
  a.card {
    display: block; text-decoration: none; color: inherit; border-radius: 22px; overflow: hidden;
    background: #24163f; border: 3px solid rgba(255,255,255,.14);
    box-shadow: 0 10px 28px rgba(0,0,0,.45); transition: transform .12s;
  }
  a.card:active { transform: scale(.97); }
  .cover { aspect-ratio: 16 / 12; overflow: hidden; }
  .cover img { width: 100%; height: 100%; object-fit: cover; object-position: center 22%; display: block; }
  .info { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px 16px; }
  .info h2 { font-size: 26px; line-height: 1.05; }
  .info p { font-family: system-ui, sans-serif; font-weight: 600; font-size: 14px; color: #c9b8ee; margin-top: 4px; }
  .play { flex: none; min-width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-size: 24px;
    background: linear-gradient(180deg, #3be07d, #12a04c); box-shadow: 0 4px 0 #0a5e2c; }
  .tigrinho h2 { color: #ffd23a; }
  .reuniao h2 { color: #ff9a3a; }
  .boliche h2 { color: #7fd0ff; }
  .boliche .cover img { object-position: center 45%; }
</style>
</head>
<body>
  <h1>JOGOS DO<br>ESCRITÓRIO</h1>
  <p class="sub">escolhe um e boa sorte (você vai precisar)</p>

  <div class="grid">
    <a class="card tigrinho" href="tigrinho/">
      <div class="cover"><img src="capas/tigrinho.jpg" alt="Fortune Fórmula"></div>
      <div class="info">
        <div><h2>FORTUNE FÓRMULA</h2><p>O caça-níquel em que a casa sempre ganha.</p></div>
        <span class="play" aria-hidden="true">▶</span>
      </div>
    </a>
    <a class="card reuniao" href="reuniao/">
      <div class="cover"><img src="capas/reuniao.jpg" alt="Sem Reunião!"></div>
      <div class="info">
        <div><h2>SEM REUNIÃO!</h2><p>Galinhada em quem chama pra call rapidinha.</p></div>
        <span class="play" aria-hidden="true">▶</span>
      </div>
    </a>
    <a class="card boliche" href="boliche/">
      <div class="cover"><img src="capas/boliche.jpg" alt="Strike na Reunião!"></div>
      <div class="info">
        <div><h2>STRIKE NA REUNIÃO!</h2><p>Boliche 3D: os pinos são a equipe inteira.</p></div>
        <span class="play" aria-hidden="true">▶</span>
      </div>
    </a>
  </div>
</body>
</html>
